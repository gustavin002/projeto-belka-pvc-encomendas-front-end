<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Minhas Entregas Atribuídas</h2>
            <a th:href="@{/logout}" class="btn btn-outline-danger">Sair</a>
        </div>
 
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="entrega : ${entregas}">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white d-flex justify-content-between">

                        <span>Entrega<span th:text="${entrega.idEntrega}"></span></span>
                    </div>
                    <div class="card-body">
                        <p class="mb-1">
                            <span>Status:</span>
                            <span class="badge bg-secondary" th:text="${entrega.encomenda?.statusEncomenda}">Status</span>
                        </p>
                        <p class="mb-1">
                            <span>Cliente:</span>
                            <span th:text="${entrega.encomenda?.cliente?.nomeCliente}">Nome</span>
                        </p>
                        <p class="mb-3">
                            <span>Local Atual:</span>
                            <span th:text="${entrega.encomenda?.enderecoAtualEncomenda}">Local</span>
                        </p>
 
                        <a th:href="@{/entregador/entrega/{id}(id=${entrega.idEntrega})}"
                           class="btn btn-outline-primary w-100">Gerenciar Entrega</a>
                    </div>
                </div>
            </div>
        </div>
 
        <div th:if="${#lists.isEmpty(entregas)}" class="alert alert-info mt-3">
            Você não possui nenhuma entrega atribuída no momento.
        </div>
    </div>
</body>
</html>
