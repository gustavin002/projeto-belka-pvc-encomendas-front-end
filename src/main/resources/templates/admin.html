<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Painel de Administração</h2>
            <div>
                <a th:href="@{/cadastrar}" class="btn btn-success me-2">Novo Usuário</a>
                <a th:href="@{/logout}" class="btn btn-outline-danger">Sair</a>
            </div>
        </div>

        <div th:if="${sucesso != null}" class="alert alert-success shadow-sm" th:text="${sucesso}"></div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white">Operadores Logísticos</div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Disponibilidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="operador : ${operadores}">
                            <td th:text="${operador.nomeUsuario}"></td>
                            <td th:text="${operador.emailUsuario}"></td>
                            <td th:text="${operador.disponibilidadeUsuario}"></td>
                        </tr>

                        <tr th:if="${operadores == null or operadores.isEmpty()}">
                            <td colspan="3" class="text-center text-muted py-3">Nenhum operador logístico cadastrado.</td>
                        </tr>
                        
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card shadow-sm mb-5">
            <div class="card-header bg-dark text-white">Entregadores</div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Disponibilidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entregador : ${entregadores}">
                            <td th:text="${entregador.nomeUsuario}"></td>
                            <td th:text="${entregador.emailUsuario}"></td>
                            <td th:text="${entregador.disponibilidadeUsuario}">e</td>
                        </tr>
                        
                        <tr th:if="${entregadores == null or entregadores.isEmpty()}">
                            <td colspan="3" class="text-center text-muted py-3">Nenhum entregador cadastrado.</td>
                        </tr>
                        
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>
</body>
</html>
