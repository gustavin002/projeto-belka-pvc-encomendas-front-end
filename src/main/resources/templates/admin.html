<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Painel de Administração</h2>
            <a th:href="@{/admin/cadastrar}" class="btn btn-success">Novo Usuário</a>
        </div>

        <div th:if="${sucesso != null}" class="alert alert-success" th:text="${sucesso}"></div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white">Operadores Logísticos</div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="operador : ${operadores}">
                            <td th:text="${operador.nome}">Nome do Operador</td>
                            <td th:text="${operador.email}">email@exemplo.com</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">Entregadores</div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entregador : ${entregadores}">
                            <td th:text="${entregador.nome}">Nome do Entregador</td>
                            <td th:text="${entregador.email}">email@exemplo.com</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
