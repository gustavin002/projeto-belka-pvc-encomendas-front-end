<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Encomenda</title>
    <!-- Apenas a folha de estilo do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Status da Encomenda</h3>
            </div>

            <div class="card-body" th:if="${encomenda != null}">
                <p><span class="fw-bold">Código:</span> <span th:text="${encomenda.codigoRastreioEncomenda}"></span></p>
                <p><span class="fw-bold">Status Atual:</span> <span class="badge bg-info text-dark" th:text="${encomenda.statusEncomenda}"></span></p>
                <p><span class="fw-bold">Localização Atual:</span> <span th:text="${encomenda.enderecoAtualEncomenda}"></span></p>
                <hr>
                <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
            </div>

            <div class="card-body" th:if="${encomenda == null}">
                <p class="text-muted mb-3">Nenhuma encomenda encontrada no momento.</p>
                <a th:href="@{/}" class="btn btn-secondary">Voltar ao Início</a>
            </div>

        </div>
    </div>
</body>
</html>
