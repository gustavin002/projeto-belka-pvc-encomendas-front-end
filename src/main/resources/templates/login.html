<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Logístico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="h4">Acesso Restrito</h2>
            <p class="text-muted">Faça login para continuar</p>
        </div>
        
        <!-- O action aqui dependerá de como seu LoginController foi implementado -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
            <div class="text-center">
                <a th:href="@{/}" class="text-decoration-none small text-muted">Voltar para Rastreio Público</a>
            </div>
        </form>
    </div>
</body>
</html>
