<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Logístico</title>
    <!-- Apenas a folha de estilo do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                
                <div class="card shadow-sm p-4 w-100">
                    <div class="text-center mb-4">
                        <h2 class="h4">Acesso Restrito</h2>
                        <p class="text-muted">Faça login para continuar</p>
                    </div>

                    <div th:if="${erroLogin != null}" class="alert alert-danger text-center py-2 mb-3" th:text="${erroLogin}"></div>

                    <form th:action="@{/logar}" th:object="${credenciais}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="seuemail@exemplo.com" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Senha</label>
                            <input type="password" th:field="*{senha}" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                        
                        <div class="text-center">
                            <a th:href="@{/}" class="text-decoration-none small text-muted">Voltar para Rastreio Público</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
