<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Rastreamento de Encomendas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <h2 class="card-title mb-4">Rastrear Encomenda</h2>

                            <div th:if="${erroRastreio != null}" class="alert alert-danger" th:text="${erroRastreio}"></div>

                            <form th:action="@{cliente/rastreio}" method="get">
                                <div class="mb-3">
                                    <input type="text" class="form-control form-control-lg" name="codigo" placeholder="Digite o código de rastreio" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">Rastrear</button>
                            </form>
                            <hr>
                            <a th:href="@{/login}" class="text-decoration-none">Acesso para Funcionários</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
