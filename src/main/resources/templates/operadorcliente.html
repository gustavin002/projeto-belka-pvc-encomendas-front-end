<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Encomendas por Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Consultar Encomendas por Cliente</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/operador/encomendas/cliente}" method="get" class="d-flex gap-2">
                    <input type="number" name="idCliente" class="form-control" placeholder="Digite o ID do Cliente" required>
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm" th:if="${encomendas != null}">
            <div class="card-header bg-dark text-white">Resultados da Busca</div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Código</th>
                            <th>Status</th>
                            <th>Local</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="encomenda : ${encomendas}">
                            <td class="fw-bold" th:text="${encomenda.codigoRastreio}">BR...</td>
                            <td th:text="${encomenda.status}">Status</td>
                            <td th:text="${encomenda.localAtual}">Local</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
