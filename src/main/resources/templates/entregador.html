<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Minhas Entregas Atribuídas</h2>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="entrega : ${entregas}">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white d-flex justify-content-between">
                        <span>Viagem #<span th:text="${entrega.id}"></span></span>
                    </div>
                    <div class="card-body">
                        <!-- Assumindo que a EntregaDTO possui a encomenda aninhada. Adapte se a estrutura for diferente -->
                        <p class="mb-1"><strong>Status:</strong> <span class="badge bg-secondary" th:text="${entrega.encomenda?.status}">Status</span></p>
                        <p class="mb-3"><strong>Destino:</strong> <span th:text="${entrega.encomenda?.localAtual}">Local</span></p>
                        
                        <a th:href="@{/entregador/entregas/{id}(id=${entrega.id})}" class="btn btn-outline-primary w-100">Gerenciar Entrega</a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(entregas)}" class="alert alert-info mt-3">
            Você não possui nenhuma entrega pendente no momento.
        </div>
    </div>
</body>
</html>
