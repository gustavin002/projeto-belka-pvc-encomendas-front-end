<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Cadastrar Usuário</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0">Cadastrar Novo Usuário</h4>
                        </div>
                        <div class="card-body">

                            <form th:action="@{/formcadastrar}" th:object="${usuario}" method="post">

                                <div class="mb-3">
                                    <label class="form-label">Nome Completo</label>
                                    <input type="text" class="form-control" th:field="*{nomeUsuario}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{emailUsuario}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Senha</label>
                                    <input type="password" class="form-control" th:field="*{senhaUsuario}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label d-block mb-2">Disponibilidade Inicial</label>
                                    <div class="btn-group w-100" role="group">
                                        <input type="radio" class="btn-check" th:field="*{disponibilidadeUsuario}" id="dispSim" value="Disponivel" required>
                                        <label class="btn btn-outline-secondary" for="dispSim">Disponível</label>

                                        <input type="radio" class="btn-check" th:field="*{disponibilidadeUsuario}" id="dispNao" value="Indisponivel" required>
                                        <label class="btn btn-outline-secondary" for="dispNao">Indisponível</label>
                                    </div>
                                </div>

                                <div class="mb-4 p-3 border rounded border-success bg-light">
                                    <label class="form-label fw-bold d-block mb-3">Tipo de Usuário</label>
                                    <div class="btn-group w-100" role="group">
                                        <input type="radio" class="btn-check" name="role" id="btnEntregador" value="entregador" required>
                                        <label class="btn btn-outline-success" for="btnEntregador">Entregador</label>

                                        <input type="radio" class="btn-check" name="role" id="btnOperador" value="operador logistico" required>
                                        <label class="btn btn-outline-success" for="btnOperador">Operador Logístico</label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between mt-4">
                                    <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-success">Salvar Cadastro</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
