<<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Cadastrar Novo Usuário</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/cadastrar}" th:object="${usuario}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" th:field="*{nome}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" th:field="*{senha}" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Tipo de Usuário</label>
                                <select class="form-select" name="role" required>
                                    <option value="" disabled selected>Selecione uma opção...</option>
                                    <option value="entregador">Entregador</option>
                                    <option value="operador">Operador Logístico</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Salvar Cadastro</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
