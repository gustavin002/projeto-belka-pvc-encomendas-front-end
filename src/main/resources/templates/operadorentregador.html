<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entregadores Disponíveis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Atribuir Encomenda a Entregador</h2>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="entregador : ${entregadores}">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title" th:text="${entregador.nomeUsuario}">Nome</h5>
                        <p class="text-muted small" th:text="${entregador.emailUsuario}">email</p>
                        <hr>
                        
                        <form th:action="@{/operador/escolher/entregador}" method="post">
                            <input type="hidden" name="idEntregador" th:value="${entregador.idUsuario}">
                            
                            <div class="mb-3 text-start">
                                <label class="form-label small fw-bold">Selecione a Encomenda:</label>
                                
                                <select name="idEncomenda" class="form-select form-select-sm" required>
                                    <option value="" disabled selected>Escolha a encomenda...</option>

                                    <option th:each="encomenda : ${encomendas}" 
                                            th:value="${encomenda.idEncomenda}" 
                                            th:text="'ID: ' + ${encomenda.idEncomenda} + ' - ' + ${encomenda.enderecoAtualEncomenda}">
                                    </option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-warning w-100">Atribuir Viagem</button>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${#lists.isEmpty(entregadores)}" class="alert alert-warning mt-4 text-center">
            Nenhum entregador disponível no momento.
        </div>
        
        <div class="mt-4">
            <a th:href="@{/operador/encomendas}" class="btn btn-outline-dark">Voltar para Encomendas</a>
        </div>
    </div>
</body>
</html>
